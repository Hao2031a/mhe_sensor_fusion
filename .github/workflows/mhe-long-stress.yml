name: MHE Long-Duration Stress and Covariance Consistency

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: '10 or 30 minutes of ROS-node stress (or 1 for debugging)'
        required: true
        type: choice
        default: '10'
        options: ['1', '10', '30']
      seed_mode:
        description: '1 seed for stress only, or 3 independent seeds with held-out calibration proposal'
        required: true
        type: choice
        default: '1'
        options: ['1', '3']
      strict_realtime:
        description: 'Use strict performance gate only on a controlled runner'
        required: true
        type: boolean
        default: false
      consistency_gate:
        description: 'Fail on synthetic NEES calibration thresholds (experimental)'
        required: true
        type: boolean
        default: false

jobs:
  long-stress:
    runs-on: ubuntu-24.04
    timeout-minutes: 130
    permissions:
      contents: read
    env:
      PACKAGE_PATH: .  # monorepo users: set src/mhe_sensor_fusion
    steps:
      - uses: actions/checkout@v4
      - name: Build full Kilted/Ceres image
        run: docker build --progress=plain -f "$PACKAGE_PATH/docker/Dockerfile.ci" -t mhe-fusion-ci "$PACKAGE_PATH"
      - name: Run real-node long-duration stress
        env:
          MINUTES: ${{ inputs.minutes }}
          STRICT: ${{ inputs.strict_realtime }}
          GATE: ${{ inputs.consistency_gate }}
          SEED_MODE: ${{ inputs.seed_mode }}
        run: |
          mkdir -p ci-results
          if [ "$SEED_MODE" = "3" ]; then
            SCRIPT=/ws/src/mhe_sensor_fusion/ci/run_multiseed_stress.sh
          else
            SCRIPT=/ws/src/mhe_sensor_fusion/ci/run_long_stress.sh
          fi
          docker run --rm --network host \
            -e ROS_DOMAIN_ID=42 \
            -e ROS_AUTOMATIC_DISCOVERY_RANGE=LOCALHOST \
            -e CI_ARTIFACT_DIR=/artifacts \
            -e MHE_STRESS_SECONDS="$((MINUTES * 60))" \
            -e MHE_STRESS_STRICT="$([ "$STRICT" = true ] && echo 1 || echo 0)" \
            -e MHE_STRESS_CONSISTENCY_GATE="$([ "$GATE" = true ] && echo 1 || echo 0)" \
            -v "${PWD}/ci-results:/artifacts" \
            mhe-fusion-ci /bin/bash "$SCRIPT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mhe-long-stress-${{ github.run_id }}
          path: ci-results/
          if-no-files-found: warn
          retention-days: 30
